name: Build iOS App (KMP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          chmod +x scripts/generate-ios-xcode.sh
          ./scripts/generate-ios-xcode.sh

      - name: Build iOS App (Unsigned / Simulator)
        run: |
          xcodebuild \
            -project iosApp/SmileMultifab.xcodeproj \
            -scheme SmileMultifab \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
            
      - name: Build Simulator App
        run: |
          xcodebuild \
            -project iosApp/SmileMultifab.xcodeproj \
            -scheme SmileMultifab \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch App & Take Screenshot
        run: |
          # Nyalakan Simulator iPhone 15
          xcrun simctl boot "iPhone 15" || true
          sleep 10

          # Instal & jalankan aplikasi (.app) ke dalam Simulator
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -name "*.app" | head -n 1)
          xcrun simctl install booted "$APP_PATH"
          
          # Ganti com.bundle.id sesuai Bundle Identifier di iosApp/project.yml Anda
          xcrun simctl launch booted $(defaults read "$APP_PATH/Info.plist" CFBundleIdentifier)
          
          # Tunggu 8 detik agar halaman WebView selesai loading, lalu ambil screenshot
          sleep 8
          xcrun simctl io booted screenshot screenshot-ios.png

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-screenshot
          path: screenshot-ios.png
