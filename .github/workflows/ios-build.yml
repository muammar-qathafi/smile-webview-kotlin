name: Build iOS App (KMP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          chmod +x scripts/generate-ios-xcode.sh
          ./scripts/generate-ios-xcode.sh

      - name: Build & Capture Screenshot (iPhone 17)
        run: |
          # 1. Build aplikasi untuk Simulator iPhone 17
          xcodebuild \
            -project iosApp/SmileMultifab.xcodeproj \
            -scheme SmileMultifab \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

          # 2. Nyalakan Simulator iPhone 17 (OS 26.5) dan tunggu hingga siap
          SIM_UDID="8EBAA496-5654-45BF-897F-3C4FD73935F1"
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b

          # 3. Instal dan buka aplikasi (.app)
          APP_PATH="$PWD/$(find build/Build/Products/Debug-iphonesimulator -name "*.app" | head -n 1)"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"

          # 4. Tunggu 8 detik agar halaman WebView selesai dimuat, lalu ambil screenshot
          sleep 8
          xcrun simctl io "$SIM_UDID" screenshot screenshot-ios.png

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-screenshot
          path: screenshot-ios.png

      - name: Build Unsigned IPA (iOS Device)
        run: |
          xcodebuild \
            -project iosApp/SmileMultifab.xcodeproj \
            -scheme SmileMultifab \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ipa \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p Payload
          cp -r "build-ipa/Build/Products/Release-iphoneos/Smile Multifab.app" Payload/
          zip -r SmileMultifab-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmileMultifab-ipa
          path: SmileMultifab-unsigned.ipa
